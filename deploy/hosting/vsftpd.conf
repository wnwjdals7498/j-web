listen=YES
listen_ipv6=NO
listen_port=21
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=NO
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
implicit_ssl=NO
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=YES
rsa_cert_file=/etc/jweb/tls/ftps.crt
rsa_private_key_file=/etc/jweb/tls/ftps.key
pasv_min_port=56110
pasv_max_port=56119
port_enable=NO
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/jweb/ftps-users
pam_service_name=jweb-ftps
secure_chroot_dir=/var/lib/jweb-ftps/empty
log_ftp_protocol=NO
xferlog_enable=NO
